name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: file:../data/ci.db
  AUTH_SECRET: ci-secret-ci-secret-ci-secret-1234567890
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  STORAGE_DRIVER: local

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma generate
      - run: npx prisma migrate deploy   # or `prisma db push` if you don't use migrations
      - run: npm run lint
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
