services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    environment:
      DATABASE_URL: file:/data/app.db
      UPLOADS_DIR: /app/uploads
    volumes:
      - app-data:/data
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
  uploads:
